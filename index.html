    // --- Component: Header ---
    function Header({ navLinks, onOpenContact, onActionClick, onNavigate, currentPage = 'home' }) {
      const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
      const [openDropdown, setOpenDropdown] = useState(null); // 'Courses' | 'About Us' | null
      const [hoveredCategory, setHoveredCategory] = useState(null);
      const [isScrolled, setIsScrolled] = useState(false);
      const closeTimerRef = React.useRef(null);

      useEffect(() => {
        const handleScroll = () => setIsScrolled(window.scrollY > 20);
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') {
            if (closeTimerRef.current) clearTimeout(closeTimerRef.current);
            setOpenDropdown(null);
            setHoveredCategory(null);
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => {
          window.removeEventListener('keydown', handleKeyDown);
          if (closeTimerRef.current) clearTimeout(closeTimerRef.current);
        };
      }, []);

      const handleMouseEnter = (label) => {
        if (closeTimerRef.current) {
          clearTimeout(closeTimerRef.current);
          closeTimerRef.current = null;
        }
        setOpenDropdown(label);
      };

      const handleMouseLeave = () => {
        if (closeTimerRef.current) {
          clearTimeout(closeTimerRef.current);
        }
        closeTimerRef.current = setTimeout(() => {
          setOpenDropdown(null);
          setHoveredCategory(null);
        }, 200); // 200ms smooth close delay
      };

      const handleTriggerClick = (label) => {
        if (closeTimerRef.current) {
          clearTimeout(closeTimerRef.current);
          closeTimerRef.current = null;
        }
        setOpenDropdown((prev) => (prev === label ? null : label));
      };

      return (
        <header className={`sticky top-0 z-50 w-full bg-white/80 backdrop-blur-lg transition-all duration-300 ${
          isScrolled ? 'shadow-md border-b border-gray-100' : 'border-b border-gray-100/80'
        }`}>
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="flex items-center justify-between h-16 sm:h-20">
              
              {/* Logo */}
              <div className="flex items-center">
                <a 
                  href="#" 
                  onClick={(e) => {
                    e.preventDefault();
                    if (onNavigate) onNavigate('home');
                  }}
                  className="flex items-center gap-2 group cursor-pointer"
                >
                  <img 
                    src="viskool-logo.png" 
                    alt="Viskool" 
                    className="h-5 sm:h-6 md:h-7 w-auto object-contain hover:opacity-90 transition-opacity"
                  />
                </a>
              </div>

              {/* Desktop Navigation */}
              <nav className="hidden lg:flex items-center space-x-5 xl:space-x-7 text-[#222222]">
                {navLinks.map((link) => {
                  if (link.hasDropdown) {
                    const isOpen = openDropdown === link.label;

                    return (
                      <div
                        key={link.label}
                        className="relative py-2"
                        onMouseEnter={() => handleMouseEnter(link.label)}
                        onMouseLeave={handleMouseLeave}
                      >
                        <button
                          type="button"
                          onClick={() => handleTriggerClick(link.label)}
                          onKeyDown={(e) => {
                            if (e.key === 'Enter' || e.key === ' ') {
                              e.preventDefault();
                              handleTriggerClick(link.label);
                            }
                          }}
                          aria-expanded={isOpen}
                          aria-haspopup="true"
                          className="flex items-center gap-1.5 text-[14px] font-medium text-[#222222] hover:text-[#8B1538] py-1 transition-colors duration-200 cursor-pointer focus:outline-hidden focus:text-[#8B1538]"
                        >
                          <span>{link.label}</span>
                          <svg 
                            className={`w-3.5 h-3.5 text-[#8B1538] transition-transform duration-200 ${isOpen ? 'rotate-180' : ''}`}
                            fill="none" 
                            stroke="currentColor" 
                            viewBox="0 0 24 24"
                          >
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M19 9l-7 7-7-7" />
                          </svg>
                        </button>

                        {/* Courses Mega Dropdown Menu */}
                        {isOpen && link.label === 'Courses' && (
                          <div className="absolute left-0 top-full pt-1.5 z-50 animate-fadeIn">
                            <div className="flex bg-white rounded-xl shadow-2xl border border-gray-100 overflow-hidden">
                              
                              {/* Left Panel: Categories */}
                              <div className="w-52 bg-[#F7F2F4]/60 border-r border-gray-100 py-1.5">
                                {COURSE_CATEGORIES_WITH_ITEMS.map((cat) => {
                                  const isActive = hoveredCategory?.id === cat.id;
                                  return (
                                    <button
                                      key={cat.id}
                                      type="button"
                                      onMouseEnter={() => setHoveredCategory(cat)}
                                      onClick={() => {
                                        setHoveredCategory(cat);
                                        onActionClick(`Selected Category: ${cat.name}`);
                                      }}
                                      className={`w-full flex items-center justify-between px-4 py-2.5 text-[13.5px] text-left transition-colors duration-150 ${
                                        isActive
                                          ? 'bg-[#EFE2E6] text-[#8B1538] font-bold'
                                          : 'text-gray-700 font-normal hover:bg-gray-100/80 hover:text-[#8B1538]'
                                      }`}
                                    >
                                      <span>{cat.name}</span>
                                      <span className={`text-xs ${isActive ? 'text-[#8B1538] font-bold' : 'text-gray-300'}`}>
                                        ›
                                      </span>
                                    </button>
                                  );
                                })}
                              </div>

      // Active publicly visible slides (Banners 1, 2 & 3)

      const nextSlide = () => {
        setCurrentSlide((prev) => (prev + 1) % activeSlides.length);

      const prevSlide = () => {
        setCurrentSlide((prev) => (prev - 1 + activeSlides.length) % activeSlides.length);
      };

      // Autoplay rotation every 6.5 seconds (paused on hover)
      useEffect(() => {
        if (isHovered || activeSlides.length <= 1) return;

        const timer = setInterval(() => {
          nextSlide();
        }, 6500);

        return () => clearInterval(timer);
      }, [activeSlides.length, isHovered]);

      const slide = activeSlides[currentSlide] || activeSlides[0];
      const isLight = slide.theme === 'light';

      const handlePrimaryClick = (cta) => {
        if (cta.type === 'explore') {
          if (onNavigate) {
            onNavigate('courses');
          } else {
            const coursesSection = document.getElementById('courses');
            if (coursesSection) {
              coursesSection.scrollIntoView({ behavior: 'smooth' });
            } else if (onActionClick) {
              onActionClick('Explore Courses');
            }

        } else if (cta.type === 'demo' || cta.type === 'contact') {

    function ContactModal({ isOpen, onClose, initialData, onSubmitSuccess }) {
      const [formData, setFormData] = useState({
        firstName: '',
        lastName: '',
        email: '',
        phone: '',
        message: '',
      });

      const [isSubmitted, setIsSubmitted] = useState(false);
      const previousActiveElementRef = React.useRef(null);
      const firstNameInputRef = React.useRef(null);

      React.useEffect(() => {
        if (isOpen) {
          previousActiveElementRef.current = document.activeElement;
          document.body.style.overflow = 'hidden';

          const handleKeyDown = (e) => {
            if (e.key === 'Escape') {
              onClose();
            }
          };

          window.addEventListener('keydown', handleKeyDown);

          setTimeout(() => {
            if (firstNameInputRef.current) {
              firstNameInputRef.current.focus();
            }
          }, 50);

          return () => {
            document.body.style.overflow = '';
            window.removeEventListener('keydown', handleKeyDown);
            if (previousActiveElementRef.current && typeof previousActiveElementRef.current.focus === 'function') {
              previousActiveElementRef.current.focus();
            }
          };
        }
      }, [isOpen, onClose]);

      if (!isOpen) return null;

      const handleSubmit = (e) => {
        e.preventDefault();
        setIsSubmitted(true);
        setTimeout(() => {
          if (onSubmitSuccess) {
            onSubmitSuccess('Thank you! Our friendly team will contact you shortly.');
          }
          setIsSubmitted(false);
          onClose();
        }, 1500);
      };

      return (
        <div
          className="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 bg-black/60 backdrop-blur-sm transition-opacity duration-300"
          onClick={onClose}
          aria-modal="true"
          role="dialog"
          aria-labelledby="modal-title"
        >

    const observer = new ResizeObserver(checkOverflow);
    [quoteRef.current].forEach((element) => element && observer.observe(element));
    document.fonts.ready.then(checkOverflow);
    return () => observer.disconnect();

            onReadMore || isVideo ? 'cursor-pointer' : ''
          }`}
          role={onReadMore ? 'button' : undefined}
      tabIndex={onReadMore ? 0 : undefined}
      aria-label={onReadMore ? `Read full story from ${item.parentRole}` : undefined}
      onKeyDown={(event) => {
        if (event.target === event.currentTarget && onReadMore && (event.key === 'Enter' || event.key === ' ')) { event.preventDefault(); onReadMore(); }

      const sliderRef = React.useRef(null);

      const resumeTimerRef = React.useRef(null);

      const [canScrollLeft, setCanScrollLeft] = useState(false);
      const [canScrollRight, setCanScrollRight] = useState(true);
      const [isDragging, setIsDragging] = useState(false);
      const [startX, setStartX] = useState(0);
      const [scrollLeftPos, setScrollLeftPos] = useState(0);

      const [isHovered, setIsHovered] = useState(false);
      const [isFocused, setIsFocused] = useState(false);
      const [isInteracting, setIsInteracting] = useState(false);
      const [isTabInactive, setIsTabInactive] = useState(false);
      const [prefersReducedMotion, setPrefersReducedMotion] = useState(false);

      const checkScroll = () => {
        if (!sliderRef.current) return;
        const { scrollLeft, scrollWidth, clientWidth } = sliderRef.current;
        setCanScrollLeft(scrollLeft > 5);
        setCanScrollRight(scrollLeft + clientWidth < scrollWidth - 10);
      };

      React.useEffect(() => {
        const mediaQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
        setPrefersReducedMotion(mediaQuery.matches);

        const handleMotionChange = (e) => setPrefersReducedMotion(e.matches);
        if (mediaQuery.addEventListener) {
          mediaQuery.addEventListener('change', handleMotionChange);
        } else {
          mediaQuery.addListener(handleMotionChange);
        }

        const handleVisibilityChange = () => {
          setIsTabInactive(document.hidden);
        };
        document.addEventListener('visibilitychange', handleVisibilityChange);

        return () => {
          if (mediaQuery.removeEventListener) {
            mediaQuery.removeEventListener('change', handleMotionChange);
          } else {
            mediaQuery.removeListener(handleMotionChange);
          }
          document.removeEventListener('visibilitychange', handleVisibilityChange);
        };
      }, []);

      // Continuous smooth scrolling ticker (rAF at ~60fps)
      React.useEffect(() => {
        let animFrameId = null;
        let lastTime = performance.now();

        const isPaused = 
          isHovered || 
          isFocused || 
          isDragging || 
          isInteracting || 
          isTabInactive || 
          isModalOpen || 
          prefersReducedMotion;

        const smoothScrollStep = (currentTime) => {
          const slider = sliderRef.current;
          if (slider && !isPaused) {
            const delta = Math.min((currentTime - lastTime) / 1000, 0.1);
            const speed = 26; // pixels per second (slightly gentler pace)
            
            slider.scrollLeft += speed * delta;

            // Infinite wrap-around check
            if (slider.scrollLeft + slider.clientWidth >= slider.scrollWidth - 10) {
              slider.scrollLeft = 0;
            }
          }
          lastTime = currentTime;
          if (!isPaused) {
            animFrameId = requestAnimationFrame(smoothScrollStep);
          }
        };

        if (!isPaused) {
          lastTime = performance.now();
          animFrameId = requestAnimationFrame(smoothScrollStep);
        }

        return () => {
          if (animFrameId) cancelAnimationFrame(animFrameId);
        };
      }, [isHovered, isFocused, isDragging, isInteracting, isTabInactive, isModalOpen, prefersReducedMotion]);

      const triggerInteractionPause = () => {
        setIsInteracting(true);
        if (resumeTimerRef.current) clearTimeout(resumeTimerRef.current);
        resumeTimerRef.current = setTimeout(() => {
          setIsInteracting(false);
        }, 2000);

      React.useEffect(() => {
        checkScroll();
        const slider = sliderRef.current;
        if (slider) {
          slider.addEventListener('scroll', checkScroll);
          window.addEventListener('resize', checkScroll);

      const scroll = (direction) => {
        if (!sliderRef.current) return;

        const scrollAmount = sliderRef.current.clientWidth * 0.75;

            sliderRef.current.scrollTo({
              left: sliderRef.current.scrollWidth - sliderRef.current.clientWidth,
              behavior: 'smooth',
            });

        } else {

            sliderRef.current.scrollTo({ left: 0, behavior: 'smooth' });

            sliderRef.current.scrollBy({ left: scrollAmount, behavior: 'smooth' });

      };

      const handleMouseDown = (e) => {
        setIsDragging(true);
        triggerInteractionPause();
        setStartX(e.pageX - sliderRef.current.offsetLeft);
        setScrollLeftPos(sliderRef.current.scrollLeft);

      const handleMouseLeave = () => {
        setIsDragging(false);
        setIsHovered(false);
      };

      const handleMouseEnter = () => {
        setIsHovered(true);
      };

      const handleMouseUp = () => {
        setIsDragging(false);

          <div

    const scrollbarWidth = window.innerWidth - root.clientWidth;
    if (CSS.supports('scrollbar-gutter', 'stable')) {
      root.style.scrollbarGutter = 'stable';
    } else if (scrollbarWidth > 0) {
      const currentPadding = parseFloat(window.getComputedStyle(document.body).paddingRight) || 0;

    const trapFocus = (event) => {
      if (event.key === 'Escape') { closeRef.current(); return; }
      if (event.key !== 'Tab') return;
      const dialog = document.querySelector('[aria-labelledby="testimonial-story-title"]');
      const buttons = dialog ? Array.from(dialog.querySelectorAll('button')) : [];
      const first = buttons[0];
      const last = buttons[buttons.length - 1];
      if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
      else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
    };
    document.addEventListener('keydown', trapFocus);
    return () => {
      document.body.style.overflow = previousOverflow;
      root.style.scrollbarGutter = previousGutter;
      document.body.style.paddingRight = previousPadding;
      document.removeEventListener('keydown', trapFocus);

                    <div className="absolute top-[5%] right-[2%] sm:right-[3%] w-[130px] sm:w-[150px] aspect-[4/5] rounded-xl sm:rounded-2xl overflow-hidden bg-white border-3 border-white shadow-[0_10px_25px_rgba(139,21,56,0.12)] rotate-3 hover:rotate-0 transition-all duration-300 hover:scale-105 z-10 group">
                      <img src="student-ananya.png" alt="Viskool Student Ananya" className="w-full h-full object-cover object-top scale-105 transition-transform duration-300 group-hover:scale-110" />
                    </div>

                    {/* 3. Center Dominant Featured Portrait (Aparna R. - 42% width, 68% height) */}
                    <div className="absolute top-[10%] left-[28%] sm:left-[29%] w-[205px] sm:w-[230px] aspect-[4/5] rounded-2xl sm:rounded-3xl overflow-hidden bg-white border-4 sm:border-[5px] border-white shadow-[0_20px_45px_rgba(139,21,56,0.20)] -rotate-1.5 hover:rotate-0 transition-all duration-300 hover:scale-105 z-20 group">
                      <img src="student-aparna.jpg" alt="Viskool Student Aparna" className="w-full h-full object-cover object-top scale-105 transition-transform duration-300 group-hover:scale-110" />
                    </div>

                    {/* 4. Lower-Left Portrait (Overlapping Centre Card) */}
                    <div className="absolute bottom-[3%] left-[7%] sm:left-[9%] w-[135px] sm:w-[155px] aspect-[4/5] rounded-xl sm:rounded-2xl overflow-hidden bg-white border-3 border-white shadow-[0_12px_28px_rgba(139,21,56,0.14)] rotate-2 hover:rotate-0 transition-all duration-300 hover:scale-105 z-30 group">
                      <img src="student-rohit.png" alt="Viskool Student Rohit" className="w-full h-full object-cover object-top scale-105 transition-transform duration-300 group-hover:scale-110" />
                    </div>

                    {/* 5. Lower-Right Portrait (Overlapping Centre Card) */}
                    <div className="absolute bottom-[1%] right-[5%] sm:right-[7%] w-[135px] sm:w-[155px] aspect-[4/5] rounded-xl sm:rounded-2xl overflow-hidden bg-white border-3 border-white shadow-[0_12px_28px_rgba(139,21,56,0.14)] -rotate-2.5 hover:rotate-0 transition-all duration-300 hover:scale-105 z-30 group">
                      <img src="student-arjun.png" alt="Viskool Student Arjun" className="w-full h-full object-cover object-top scale-105 transition-transform duration-300 group-hover:scale-110" />
                    </div>

                    {/* Small Accent Burgundy Circle Dot */}
                    <div className="absolute bottom-3 right-1 w-3.5 h-3.5 rounded-full bg-[#8B1538] shadow-xs z-30 pointer-events-none" />

                  </div>
                </div>

              </div>
            </div>
          </section>

          {/* 2. TESTIMONIAL CONTENT SECTION */}
          <section id="student-testimonials-grid" className="w-full bg-[#FCFCFD] py-10 sm:py-14 border-b border-gray-100">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-8 sm:space-y-10">
              
              <div className="flex flex-col sm:flex-row items-start sm:items-end justify-between border-b border-gray-100 pb-3 gap-4">
            <h2 className="text-3xl sm:text-4xl font-extrabold text-gray-900 tracking-tight">
              Every student has a{' '}
              <span className="font-serif italic text-[#8B1538] font-bold">
                story
              </span>
            </h2>

            <div className="flex items-center gap-2.5 shrink-0">
              <button
                type="button"
                onClick={() => setReviewPage((page) => (page - 1 + reviewPageCount) % reviewPageCount)}
                aria-label="Previous testimonial slide"
                className="w-9 h-9 sm:w-10 sm:h-10 rounded-full bg-[#8B1538] hover:bg-[#73152C] text-white flex items-center justify-center transition-all duration-200 active:scale-95 shadow-sm cursor-pointer"
              >
                <svg className="w-4 h-4 sm:w-4.5 sm:h-4.5" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" d="M19 12H5M12 19l-7-7 7-7" />
                </svg>
              </button>

              <button
                type="button"
                onClick={() => setReviewPage((page) => (page + 1) % reviewPageCount)}
                aria-label="Next testimonial slide"
                className="w-9 h-9 sm:w-10 sm:h-10 rounded-full bg-[#8B1538] hover:bg-[#73152C] text-white flex items-center justify-center transition-all duration-200 active:scale-95 shadow-sm cursor-pointer"
              >
                <svg className="w-4 h-4 sm:w-4.5 sm:h-4.5" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" d="M5 12h14M12 5l7 7-7 7" />
                </svg>
              </button>
            </div>
          </div>

              <div className="flex items-center justify-center sm:justify-start flex-wrap gap-2.5 sm:gap-3">
                {STUDENT_CATEGORIES.map((category) => {
                  const isSelected = selectedCategory === category;
                  return (
                    <button
                      key={category}
                      type="button"
                      onClick={() => { setSelectedCategory(category); setReviewPage(0); }}
                      className={`px-5 py-2 sm:py-2.5 rounded-full text-xs sm:text-sm font-semibold transition-all duration-200 cursor-pointer shadow-xs ${
                        isSelected
                          ? 'bg-[#8B1538] text-white shadow-md scale-102'
                          : 'bg-white text-gray-700 hover:bg-[#FDF2F4] hover:text-[#8B1538] border border-gray-200/80'
                      }`}
                    >
                      {category}
                    </button>
                  );
                })}
              </div>

          {filteredTestimonials.length > 0 ? (
            <>
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 sm:gap-7">
            {filteredTestimonials.slice(reviewPage * 4, reviewPage * 4 + 4).map((student) => {
              const sentenceEnd = student.quote.search(/[.!?](?:\s|$)/);
              const quote = sentenceEnd >= 0 ? student.quote.slice(0, sentenceEnd + 1) : student.quote;
              const description = sentenceEnd >= 0 ? student.quote.slice(sentenceEnd + 1).trim() : '';
              return (
                <TestimonialCardItem
                  onReadMore={() => setActiveModalStudent(student)}
                  key={student.id}
                  item={{
                    mediaType: 'image',
                    quote,
                    description,
                    avatar: student.image || 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"%3E%3Crect width="48" height="48" fill="%23F1E0E5"/%3E%3Ccircle cx="24" cy="17" r="8" fill="%238B1538"/%3E%3Cpath d="M8 46v-6a16 16 0 0132 0v6" fill="%238B1538"/%3E%3C/svg%3E',
                    parentRole: student.name,
                    courseName: student.tag,
                  }}
                />
              );
            })}
          </div>
            </>
          ) : (
/* Clean Empty State */
                  <div className="col-span-full py-12 px-6 bg-white border border-gray-100 rounded-3xl text-center space-y-3.5 shadow-xs">
                    <div className="w-12 h-12 rounded-full bg-[#8B1538]/10 text-[#8B1538] mx-auto flex items-center justify-center">
                      <svg className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                      </svg>
                    </div>
                    <h3 className="text-lg font-bold text-gray-900 tracking-tight">No stories found in this category right now</h3>
                    <p className="text-xs sm:text-sm text-gray-500 max-w-sm mx-auto">
                      Try selecting another category filter above to read more inspiring student stories.
                    </p>
                    <button
                      type="button"
                      onClick={() => setSelectedCategory('All')}
                      className="inline-block text-xs font-bold text-[#8B1538] bg-[#8B1538]/10 hover:bg-[#8B1538]/15 px-4 py-2 rounded-full transition-colors cursor-pointer"
                    >
                      View All Stories
                    </button>
                  </div>
          )}
        </div>
      </section>

<section className="w-full bg-[#FCFCFD]">
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
          <ParentVideoSlider
            videos={STUDENT_TESTIMONIALS_DATA.filter((student) => student.image).map((student) => ({
              ...student,
              thumbnail: student.image,
              tagline: student.tag,
              course: student.category,
              duration: 'Coming soon',
              gradient: 'from-[#5C1B2E] via-[#38101C] to-[#19070D]',
            }))}
            audience="Students"
            onPlayVideo={setActiveVideo}
            isModalOpen={!!activeVideo}
          />
        </div>
      </section>

      {activeVideo && (
        <div
          className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-md animate-fadeIn"
          onClick={() => setActiveVideo(null)}
        >
          <div
            className="bg-white rounded-3xl max-w-2xl w-full overflow-hidden shadow-2xl relative border border-gray-100"
            onClick={(e) => e.stopPropagation()}
          >
            <button
              onClick={() => setActiveVideo(null)}
              aria-label="Close video"
              className="absolute top-4 right-4 z-20 w-9 h-9 rounded-full bg-black/50 hover:bg-black/70 text-white flex items-center justify-center text-lg font-bold transition-all cursor-pointer"
            >
              ✕
            </button>
            <div className="aspect-video bg-gray-900 flex items-center justify-center relative">
              <img src={activeVideo.thumbnail} alt="Video cover" className="w-full h-full object-cover opacity-60" />
              <div className="absolute inset-0 flex flex-col items-center justify-center p-6 text-center text-white bg-gradient-to-t from-black/80 via-black/30 to-transparent">
                <div className="w-16 h-16 rounded-full bg-[#F5BA31] text-gray-900 flex items-center justify-center text-2xl font-bold mb-3 shadow-lg">
                  ▶
                </div>
                <h4 className="text-lg font-bold">{activeVideo.name}</h4>
                <p className="text-sm mt-1">Video coming soon</p>
                <p className="text-xs text-gray-200 mt-1 max-w-md">{activeVideo.quote}</p>
              </div>
            </div>
            <div className="p-5 bg-white flex items-center justify-between">
              <div>
                <span className="text-xs font-bold text-[#8B1538] uppercase tracking-wider">{activeVideo.tagline}</span>
                <p className="text-xs text-gray-500 mt-0.5">Student Video Story • Video coming soon</p>
              </div>
              <button
                onClick={() => setActiveVideo(null)}
                className="px-4 py-2 bg-[#8B1538] hover:bg-[#73152C] text-white text-xs font-bold rounded-xl cursor-pointer"
              >
                Close Video
              </button>
            </div>
          </div>
        </div>
      )}

{/* 3. BOTTOM CTA SECTION */}
          <section className="w-full bg-gradient-to-r from-[#FFFDFE] via-[#FDF2F4] to-[#F8E1E7] py-12 sm:py-16 border-t border-[#8B1538]/10">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex flex-col md:flex-row items-center justify-between gap-6 md:gap-8 text-center md:text-left">
                <div className="space-y-2 max-w-2xl">
                  <h2 className="text-3xl sm:text-4xl md:text-[40px] font-extrabold text-gray-900 tracking-tight leading-tight">
                    Your Story Could Be{' '}
                    <span className="font-serif italic text-[#8B1538] font-bold">
                      Next
                    </span>
                  </h2>
                  <p className="text-sm sm:text-base text-gray-600 font-normal leading-relaxed">
                    Get personalised guidance and take the next step towards your goals with Viskool.
                  </p>
                </div>

                <div className="flex flex-col sm:flex-row items-center gap-3 sm:gap-4 shrink-0 w-full sm:w-auto">
                  <button
                    type="button"
                    onClick={() => onOpenContact && onOpenContact('Talk to an Expert', { source: 'Student Testimonials Bottom CTA' })}
                    className="w-full sm:w-auto inline-flex items-center justify-center bg-[#8B1538] hover:bg-[#73152C] text-white font-bold text-sm px-6 py-3 rounded-full shadow-md hover:shadow-lg transition-all duration-200 active:scale-95 cursor-pointer gap-2"
                  >
                    <span>Talk to an Expert</span>
                    <span className="text-base leading-none">→</span>
                  </button>

                  <button
                    type="button"
                    onClick={() => {
                      if (onNavigate) onNavigate('home');
                      setTimeout(() => {
                        const el = document.getElementById('courses');
                        if (el) el.scrollIntoView({ behavior: 'smooth' });
                      }, 100);
                    }}
                    className="w-full sm:w-auto inline-flex items-center justify-center bg-white hover:bg-[#FDF2F4] text-[#8B1538] border border-[#8B1538]/30 font-bold text-sm px-6 py-3 rounded-full shadow-xs transition-all duration-200 active:scale-95 cursor-pointer"
                  >
                    <span>Explore Courses</span>
                  </button>
                </div>

              </div>
            </div>
          </section>

          <TestimonialStoryDialog story={activeModalStudent} onClose={() => setActiveModalStudent(null)} />

        </div>
      );
    }

    // --- Main Root Component ---
    function MainApp() {
      const [currentPage, setCurrentPage] = useState('home');
      const [modalState, setModalState] = useState({
        isOpen: false,
        initialData: null,
      });

      const [toastMessage, setToastMessage] = useState(null);

      const showToast = (message) => {
        setToastMessage(message);
        setTimeout(() => setToastMessage(null), 3500);
      };

      const handleOpenContact = (actionTitle = 'Inquiry', extraData = null) => {
        setModalState({
          isOpen: true,
          initialData: extraData || { title: actionTitle },
        });
      };

      const handleCloseContact = () => setModalState({ isOpen: false, initialData: null });
      const handleActionClick = (actionName) => showToast(`Clicked: ${actionName}`);
      const handleEnrollCourse = (course) => handleOpenContact(course.title, course);
      const handleSelectCourse = (course) => {
        showToast(`Viewing Syllabus for "${course.title}"`);
        handleOpenContact(course.title, course);
      };
      const handleWhatsApp = () => showToast('Connecting to Viskool WhatsApp Support (+91 94000 00000)...');
      const handlePhone = () => handleOpenContact('Request Callback');
      const handleNavigate = (page) => {
        setCurrentPage(page);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      return (
        <div className="min-h-screen bg-white text-gray-900 font-sans selection:bg-[#8B1538] selection:text-white antialiased">
          
          {toastMessage && (
            <div className="fixed top-5 right-5 z-50 bg-gray-900 text-white px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-3 text-xs sm:text-sm font-medium border border-gray-700 animate-slideDown">
              <span className="text-[#8B1538] bg-white w-5 h-5 rounded-full flex items-center justify-center font-bold text-xs">✓</span>
              <span>{toastMessage}</span>
            </div>
          )}

          {/* 1. Header */}
          <Header 
            navLinks={NAV_LINKS} 
            onOpenContact={handleOpenContact}
            onActionClick={handleActionClick}
            onNavigate={handleNavigate}
            currentPage={currentPage}
          />

          {/* 2. Announcement Bar (below header) */}
          <AnnouncementBar 
            items={ANNOUNCEMENT_ITEMS} 
            onActionClick={handleActionClick} 
          />

          {/* Main Sections */}
          <main>
            {currentPage === 'parent-testimonials' ? (
              <ParentTestimonialsPage onOpenContact={handleOpenContact} />
            ) : currentPage === 'student-testimonials' ? (
              <StudentTestimonialsPage onOpenContact={handleOpenContact} onNavigate={handleNavigate} />
            ) : (
              <>
                {/* 3. Hero Carousel */}
                <Hero 
                  slides={HERO_SLIDES} 
                  onActionClick={handleActionClick}
                  onOpenContact={handleOpenContact}
                />

                {/* 4. Process Steps & Value Proposition */}
                <ProcessSteps 
                  steps={PROCESS_STEPS} 
                  onActionClick={handleActionClick}
                />

                {/* 5. Featured Courses */}
                <CourseSection 
                  categories={COURSE_CATEGORIES}
                  courses={FEATURED_COURSES}
                  onSelectCourse={handleSelectCourse}
                  onEnrollCourse={handleEnrollCourse}
                  onActionClick={handleActionClick}
                />

                {/* 6. Why Choose Us */}
                <WhyChooseUs 
                  benefits={BENEFITS} 
                  onActionClick={handleActionClick}
                />

                {/* 7. Success CTA */}
                <SuccessCTA 
                  onOpenContact={handleOpenContact}
                />

                {/* 8. Achievements */}
                <Achievements 
                  achievements={ACHIEVEMENTS} 
                  onActionClick={handleActionClick}
                />

                {/* 9. Testimonials */}
                <Testimonials 
                  testimonials={TESTIMONIALS} 
                  onActionClick={handleActionClick}
                />

                {/* 10. Start Your Learning Journey Lead Form */}
                <LearningJourneyForm 
                  onSubmitSuccess={showToast}
                />

                {/* 11. FAQ Accordion (Above Footer) */}
                <FAQSection 
                  faqs={FAQS} 
                  onActionClick={handleActionClick}
                />
              </>
            )}
          </main>

          {/* 11. Footer */}
          <Footer 
            onActionClick={handleActionClick}
            onOpenContact={handleOpenContact}
          />

          {/* 12. Floating Quick Actions */}
          <FloatingActions 
            onWhatsAppClick={handleWhatsApp}
            onPhoneClick={handlePhone}
          />

          {/* Interactive Modal */}
          <ContactModal 
            isOpen={modalState.isOpen}
            onClose={handleCloseContact}
            initialData={modalState.initialData}
            onSubmitSuccess={showToast}
          />

        </div>
      );
    }

    // Mount to DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MainApp />);
  </script>
</body>
</html>
